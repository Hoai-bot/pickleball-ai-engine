name: Render Keep Alive 24/7

on:
  schedule:
    # Tự động gửi request mỗi 10 phút
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Server
        run: |
          curl -s https://pickleball-ai-engine.onrender.com/ > /dev/null
          echo "Ping thành công lúc $(date)"
